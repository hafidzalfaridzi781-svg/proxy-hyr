name: Build PROXY HYR APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required files
        run: |
          MISSING=0
          for f in \
            settings.gradle \
            build.gradle \
            gradle.properties \
            app/build.gradle \
            app/src/main/AndroidManifest.xml \
            app/src/main/java/com/zyecitedz/proxyhyr/LoginActivity.java \
            app/src/main/java/com/zyecitedz/proxyhyr/MainActivity.java \
            app/src/main/java/com/zyecitedz/proxyhyr/ShizukuHelper.java \
            app/src/main/java/com/zyecitedz/proxyhyr/PermissionHelper.java \
            app/src/main/java/com/zyecitedz/proxyhyr/BackgroundService.java \
            app/src/main/res/layout/activity_login.xml \
            app/src/main/res/layout/activity_main.xml \
            app/src/main/res/values/strings.xml \
            app/src/main/res/values/colors.xml \
            app/src/main/res/values/themes.xml \
            app/src/main/res/xml/network_security_config.xml \
            app/src/main/res/anim/shake.xml \
            app/src/main/assets/index.html \
            app/src/main/assets/localconfig.json \
            scripts/gen_patch.py \
            scripts/gen_shader.py \
            scripts/gen_vqcfg.py \
            scripts/build_assets.py ; do
            if [ ! -f "$f" ]; then
              echo "❌ MISSING: $f"
              MISSING=1
            else
              echo "✅ $f"
            fi
          done
          if [ $MISSING -eq 1 ]; then
            echo ""
            echo "File di atas belum di-commit. Tambahkan dulu."
            exit 1
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          echo "$PWD/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Generate binary assets
        run: python scripts/build_assets.py

      - name: Build APK (debug)
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PROXY-HYR-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PROXY HYR v1.0.${{ github.run_number }} — ZyeCitedz
          files: app/build/outputs/apk/debug/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
