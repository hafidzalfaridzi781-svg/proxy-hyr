name: Build PROXY HYR APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          echo "$PWD/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Generate binary assets
        run: python scripts/build_assets.py

      - name: Build APK (debug)
        run: gradle assembleDebug --no-daemon

      - name: Build APK (release unsigned)
        run: gradle assembleRelease --no-daemon

      - name: List outputs
        run: ls -la app/build/outputs/apk/debug/ app/build/outputs/apk/release/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PROXY-HYR-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: PROXY-HYR-release
          path: app/build/outputs/apk/release/*.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PROXY HYR v1.0.${{ github.run_number }} — ZyeCitedz
          body: |
            ## PROXY HYR — Unity IL Patch
            
            **Developer:** © ZyeCitedz  
            **Channel:** [PROXY UPDATE](https://whatsapp.com/channel/0029VbCdJuNDZ4LT4arD1H3v)
            
            ### Fitur
            - Login gate (key akses)
            - Shizuku integration
            - Background foreground service
            - Proxy config + Unity IL Patch UI
            
            ### Install
            Download APK → install → masukkan key akses.
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
