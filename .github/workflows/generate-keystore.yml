name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore proxy-hyr.keystore \
            -alias proxyhyr \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass zyecitedz123 \
            -keypass zyecitedz123 \
            -dname "CN=ZyeCitedz, OU=PROXY HYR, O=PROXY UPDATE, L=ID, S=ID, C=ID"

      - name: Base64 encode
        run: |
          base64 proxy-hyr.keystore > keystore.b64
          echo "=== COPY INI ==="
          cat keystore.b64

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: proxy-hyr.keystore
