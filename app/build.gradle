plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zyecitedz.proxyhyr'
    compileSdk 34

    defaultConfig {
        applicationId "com.zyecitedz.proxyhyr"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        setProperty("archivesBaseName", "PROXY-HYR-v${versionName}")
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "proxy-hyr.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "zyecitedz123"
            keyAlias System.getenv("KEY_ALIAS") ?: "proxyhyr"
            keyPassword System.getenv("KEY_PASSWORD") ?: "zyecitedz123"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
