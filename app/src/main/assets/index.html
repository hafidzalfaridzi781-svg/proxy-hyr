<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>PROXY HYR</title>
<style>
  :root{--bg:#05070a;--card:#0d131c;--card2:#111a26;--line:#1c2a3a;
        --text:#e8f4ff;--muted:#7f95ad;--cyan:#00e5ff;--green:#00ff9d;
        --red:#ff3b5c;--yellow:#ffd60a;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;min-height:100%;
    background:radial-gradient(circle at 20% 0%,rgba(0,229,255,.10),transparent 35%),
               radial-gradient(circle at 100% 20%,rgba(0,255,157,.08),transparent 30%),
               linear-gradient(180deg,var(--bg),#0a0f16);
    color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .app{max-width:480px;margin:0 auto;padding:18px 14px 28px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
    background:linear-gradient(135deg,rgba(0,229,255,.18),rgba(0,255,157,.12));
    border:1px solid rgba(0,229,255,.35);color:var(--cyan);font-weight:900;font-size:18px;}
  .brand h1{margin:0;font-size:15px;letter-spacing:.3px;}
  .brand p{margin:3px 0 0;font-size:11px;color:var(--muted);}
  .brand .dev{color:var(--green);font-weight:800;}
  .pill{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;
    border:1px solid var(--line);background:rgba(255,255,255,.03);
    font-size:11px;font-weight:700;color:var(--muted);}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--red);}
  .pill.on{color:var(--green);border-color:rgba(0,255,157,.35);}
  .pill.on .dot{background:var(--green);}
  .card{background:linear-gradient(180deg,var(--card),var(--card2));
    border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;}
  .card-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .card-title h2{margin:0;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--cyan);}
  .badge{font-size:10px;padding:4px 8px;border-radius:999px;
    background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.22);
    color:var(--cyan);font-weight:700;}
  .field{margin-bottom:12px;}
  .field:last-child{margin-bottom:0;}
  label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;}
  input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);
    background:rgba(0,0,0,.28);color:var(--text);padding:0 12px;font-size:13px;outline:none;}
  input:focus{border-color:rgba(0,229,255,.6);}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .btn{width:100%;height:48px;border:0;border-radius:14px;font-size:13px;font-weight:800;
    letter-spacing:.4px;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:8px;transition:.2s;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:linear-gradient(135deg,var(--cyan),var(--green));color:#001016;}
  .btn-secondary{background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--line);}
  .btn-channel{background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;margin-top:10px;}
  .btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .result{margin-top:10px;padding:10px;border-radius:10px;background:#030609;
    border:1px solid var(--line);font-family:ui-monospace,Menlo,monospace;
    font-size:11px;color:#b7d7ea;word-break:break-all;min-height:36px;white-space:pre-wrap;}
  .result.ok{color:var(--green);border-color:rgba(0,255,157,.35);}
  .result.err{color:var(--red);border-color:rgba(255,59,92,.35);}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:11px;}
  .kv .k{color:var(--muted);}
  .kv .v{color:var(--text);text-align:right;font-family:ui-monospace,monospace;}
  .footer{text-align:center;color:var(--muted);font-size:10px;margin-top:8px;line-height:1.6;}
  .footer a{color:var(--cyan);text-decoration:none;}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="logo">PH</div>
      <div>
        <h1>PROXY HYR</h1>
        <p>Network Tool • <span class="dev" id="devName">© ZyeCitedz</span></p>
      </div>
    </div>
    <div class="pill" id="statusPill">
      <span class="dot"></span><span id="statusText">OFFLINE</span>
    </div>
  </header>

  <section class="card">
    <div class="card-title"><h2>Shizuku</h2><span class="badge" id="shizukuBadge">?</span></div>
    <div class="kv">
      <span class="k">Status</span><span class="v" id="shizukuStatus">-</span>
    </div>
    <button class="btn btn-secondary" style="margin-top:10px;"
            onclick="HYR.requestShizuku()">REQUEST SHIZUKU</button>
  </section>

  <section class="card">
    <div class="card-title"><h2>Test Proxy</h2><span class="badge">REAL</span></div>
    <div class="row">
      <div class="field"><label>Host</label><input id="proxyHost" value="127.0.0.1"/></div>
      <div class="field"><label>Port</label><input id="proxyPort" type="number" value="8080"/></div>
    </div>
    <button class="btn btn-primary" onclick="testProxy()">TEST PROXY</button>
    <div class="result" id="proxyResult">Tekan TEST PROXY untuk cek koneksi.</div>
  </section>

  <section class="card">
    <div class="card-title"><h2>Cek IP Publik</h2><span class="badge">REAL</span></div>
    <button class="btn btn-primary" onclick="HYR.checkIP()">CEK IP SAYA</button>
    <div class="result" id="ipResult">-</div>
  </section>

  <section class="card">
    <div class="card-title"><h2>Ping & DNS</h2><span class="badge">REAL</span></div>
    <div class="field"><label>Host</label>
      <input id="pingHost" value="8.8.8.8"/></div>
    <div class="btn-grid">
      <button class="btn btn-primary" onclick="pingHost()">PING</button>
      <button class="btn btn-secondary" onclick="dnsLookup()">DNS</button>
    </div>
    <div class="result" id="pingResult">-</div>
  </section>

  <section class="card">
    <div class="card-title"><h2>Device Info</h2><span class="badge">REAL</span></div>
    <div class="kv" id="deviceInfo">-</div>
    <div class="kv" id="batteryInfo" style="margin-top:10px;"></div>
    <button class="btn btn-secondary" style="margin-top:10px;" onclick="refreshInfo()">
      REFRESH
    </button>
  </section>

  <button class="btn btn-channel" onclick="HYR.openChannel()">
    📢 PROXY UPDATE — WhatsApp Channel
  </button>

  <div class="footer">
    © <span id="devName2">ZyeCitedz</span> — PROXY HYR v1.0.0<br>
    <a href="#" onclick="HYR.openChannel();return false;">PROXY UPDATE</a>
  </div>
</div>

<script>
  window.onload = function() {
    try {
      document.getElementById("devName").textContent  = "© " + HYR.developer();
      document.getElementById("devName2").textContent = HYR.developer();
      refreshShizuku();
      refreshInfo();
    } catch(e){}
  };

  function refreshShizuku() {
    try {
      const ok = HYR.shizukuReady();
      document.getElementById("shizukuBadge").textContent = ok ? "✓" : "!";
      document.getElementById("shizukuStatus").textContent = ok ? "GRANTED" : "NOT GRANTED";
      if (ok) document.getElementById("statusPill").classList.add("on");
    } catch(e){}
  }
  window.onShizukuStatus = function(granted) {
    refreshShizuku();
  };

  function testProxy() {
    const host = document.getElementById("proxyHost").value.trim();
    const port = parseInt(document.getElementById("proxyPort").value);
    const el = document.getElementById("proxyResult");
    el.className = "result";
    el.textContent = "Testing " + host + ":" + port + " ...";
    HYR.testProxy(host, port);
  }
  window.onProxyResult = function(r) {
    const el = document.getElementById("proxyResult");
    if (r.ok) {
      el.className = "result ok";
      el.textContent = "✅ SUKSES\nLatency: " + r.latency + " ms\nHTTP: " + r.code
                       + "\nIP keluar: " + r.ip;
    } else {
      el.className = "result err";
      el.textContent = "❌ GAGAL\n" + (r.error || "code " + r.code);
    }
  };

  window.onIPResult = function(r) {
    const el = document.getElementById("ipResult");
    if (r.ok) {
      el.className = "result ok";
      el.textContent = "IP Publik: " + r.ip;
    } else {
      el.className = "result err";
      el.textContent = "Error: " + r.error;
    }
  };

  function pingHost() {
    const host = document.getElementById("pingHost").value.trim();
    const el = document.getElementById("pingResult");
    el.className = "result";
    el.textContent = "Ping " + host + " ...";
    HYR.ping(host);
  }
  window.onPingResult = function(r) {
    const el = document.getElementById("pingResult");
    if (r.ok) {
      el.className = "result ok";
      el.textContent = "✅ " + r.ip + "\nLatency: " + r.latency + " ms";
    } else {
      el.className = "result err";
      el.textContent = "❌ " + (r.error || "unreachable");
    }
  };

  function dnsLookup() {
    const host = document.getElementById("pingHost").value.trim();
    const el = document.getElementById("pingResult");
    el.className = "result";
    el.textContent = "Resolving " + host + " ...";
    HYR.dnsLookup(host);
  }
  window.onDnsResult = function(r) {
    const el = document.getElementById("pingResult");
    if (r.ok) {
      el.className = "result ok";
      el.textContent = "✅ DNS Result:\n" + r.ips.join("\n");
    } else {
      el.className = "result err";
      el.textContent = "❌ " + r.error;
    }
  };

  function refreshInfo() {
    try {
      const d = JSON.parse(HYR.deviceInfo());
      document.getElementById("deviceInfo").innerHTML =
          "<span class='k'>Model</span><span class='v'>" + d.model + "</span>" +
          "<span class='k'>Brand</span><span class='v'>" + d.brand + "</span>" +
          "<span class='k'>Android</span><span class='v'>" + d.android + "</span>" +
          "<span class='k'>ABI</span><span class='v'>" + d.abi + "</span>" +
          "<span class='k'>Heap</span><span class='v'>" + d.heap_total_mb + "/" +
          d.heap_max_mb + " MB</span>";

      const b = JSON.parse(HYR.batteryInfo());
      document.getElementById("batteryInfo").innerHTML =
          "<span class='k'>Baterai</span><span class='v'>" + b.level + "%</span>";
    } catch(e){}
  }
</script>
</body>
</html>
